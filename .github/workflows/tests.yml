name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Lint and core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  home-assistant:
    name: Home Assistant tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: >-
          pip install "pytest-homeassistant-custom-component==0.13.316"
          aiousbwatcher pyserial bleak-retry-connector
      - run: pytest tests_ha -q -p no:cacheprovider
